<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BIST Analiz">
    <meta name="description" content="BIST hisselerini 15 teknik indikatör ile analiz edin. AL/SAT/NÖTR önerisi alın.">
    <title>BIST Teknik Analiz Ajanı</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">📊</span>
            <span class="nav-title">BIST Teknik Analiz Ajanı</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link active">Dashboard</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>⚠️ Bu uygulama yalnızca bilgilendirme amaçlıdır. Yatırım tavsiyesi niteliği taşımaz. Yatırım kararlarınızı
            kendi araştırmanıza dayandırın.</p>
    </footer>

    <script>
        // PWA Service Worker kaydı
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => { });
        }
    </script>
</body>

</html>
